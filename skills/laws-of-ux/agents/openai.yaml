interface:
  display_name: Laws of UX
  short_description: Diagnose behavioural UX friction with evidence
  default_prompt: Use $laws-of-ux when a behavioural mechanism could materially change the design decision. Diagnose the dominant friction, use evidence before law names, select at most three distinct mechanisms, grade confidence, check collisions and hard constraints, then recommend the smallest falsifiable correction. Abstain for styling or implementation-only work.
policy:
  products:
  - chatgpt
  - codex
  - api
  - atlas
  allow_implicit_invocation: true
