interface:
  display_name: Lundy
  short_description: Independently validate completed work and return a verdict.
  default_prompt: Use $lundy to validate this completed change through read-only evidence
    lanes, then return a verdict (validated, partly verified, not validated or blocked)
    with the decisive proof and the smallest next action.
policy:
  products:
  - chatgpt
  - codex
  - api
  - atlas
  allow_implicit_invocation: true
